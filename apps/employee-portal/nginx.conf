server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Dynamically resolve Docker backend to prevent DNS caching issues and IPv6 mismatch
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url "${BACKEND_URL}";

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──────────────────────────────────────────────
    # BOT / SCANNER BLOCKING (early return, no body)
    # ──────────────────────────────────────────────
    set $block_scanner "0";
    if ($http_user_agent ~* (sqlmap|nikto|dirbuster|nessus|w3af|acunetix|masscan|zgrab|httpx|nuclei)) {
        set $block_scanner "1";
    }
    if ($http_user_agent ~* "HealthCheck/") {
        set $block_scanner "0";
    }
    if ($block_scanner = "1") {
        return 444;
    }

    # Block PHP / WordPress probing paths
    location ~* \.php(\d+)?$ {
        return 444;
    }
    location ~* ^/(xmlrpc\.php|wp-login\.php|wp-admin|wp-content|wp-includes|wordpress|backup)(/|$) {
        return 444;
    }

    # Block sensitive config file probes
    location ~* (\.(env|htaccess|htpasswd|bak|sql|log)$|sftp-config\.json$|\.vscode/) {
        return 444;
    }

    # VCS directory probes (.git/, .svn/, .hg/) — return 404
    location ~* ^/\.(git|svn|hg)(/|$) {
        return 404;
    }

    # ──────────────────────────────────────────────
    # HEALTH CHECK
    # ──────────────────────────────────────────────
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ──────────────────────────────────────────────
    # RUNTIME CONFIG (no-store for fresh config)
    # ──────────────────────────────────────────────
    location = /runtime-config.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ──────────────────────────────────────────────
    # API PROXY (Same-Origin /api prefix)
    # ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # CRITICAL: Preserve incoming Host header to upstream for strict CSRF checks
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTPS-only public portal; TLS terminates at Traefik.
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ──────────────────────────────────────────────
    # UPLOADED MEDIA PROXY (Same-Origin /uploads prefix)
    # ──────────────────────────────────────────────
    # Listing.primaryImageUrl is stored relative (e.g. /uploads/csflow-images/...)
    # for vehicles imported into Motolia, and absolute only for external CDNs.
    # Without this block the relative path falls through to the SPA fallback and
    # the browser receives index.html instead of an image.
    location /uploads/ {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ──────────────────────────────────────────────
    # HASHED ASSETS (Vite fingerprinted JS & CSS bundles)
    # ──────────────────────────────────────────────
    location /assets/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ──────────────────────────────────────────────
    # PUBLIC STATIC BRAND ASSETS (Logos, OG image, fonts, pictures)
    # ──────────────────────────────────────────────
    location /static/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ──────────────────────────────────────────────
    # BRAND BOOK & INTERNAL ASSETS (NOINDEX)
    # ──────────────────────────────────────────────
    location ~* (brand\.html|Benefivo-Brand-Book\.pdf)$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ──────────────────────────────────────────────
    # STATIC ROUTE PRERENDER & 301 TRAILING SLASH REDIRECTS
    # ──────────────────────────────────────────────
    location = /dla-firm/ {
        return 301 /dla-firm;
    }
    location = /dla-firm {
        try_files /dla-firm.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /regulamin/ {
        return 301 /regulamin;
    }
    location = /regulamin {
        try_files /regulamin.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /prywatnosc/ {
        return 301 /prywatnosc;
    }
    location = /prywatnosc {
        try_files /prywatnosc.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ──────────────────────────────────────────────
    # SPA ROUTING (Fallback to index.html)
    # ──────────────────────────────────────────────
    location / {
        limit_req zone=general burst=150 nodelay;

        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ /index.html;
    }

    # Ensure all HTML files are not cached aggressively
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
