<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarSalon - auta nowe i używane z gwarancją</title>
    <meta name="description" content="Setki ofert od sprawdzonych dealerów. Nowe i używane samochody z gwarancją." />
    <meta name="author" content="CarSalon" />

    <!-- Preload critical API data (globalne — używane na wszystkich trasach) -->
    <link rel="preload" href="/api/settings" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/seo" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/translations" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/geo" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/listings/options" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/rental/vehicles?limit=1" as="fetch" crossorigin="anonymous" />
    <!-- Home-only API preload — backend (render.ts) wycina ten blok poza / bo poza stroną
         główną te zapytania są nieużywane i kradną pasmo na dławionym mobile (FCP/LCP). -->
    <!--home-preload-->
    <link rel="preload" href="/api/widgets/render?placement=HOME" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/faq?page=home" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/feature-tiles/public" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/api/hero-banners/public" as="fetch" crossorigin="anonymous" />
    <!--/home-preload-->

    <!-- Dynamic Environment Config (Turnstile Site Key) — defer: klucz czytany
         dopiero przy montowaniu widgetu Turnstile, nie może blokować renderu -->
    <script src="/config.js" defer></script>

    <link rel="icon" type="image/png" href="/brands/carsalon/favicon.png" />
    <link rel="apple-touch-icon" href="/brands/carsalon/favicon.png" />

    <meta property="og:title" content="CarSalon - auta nowe i używane z gwarancją" />
    <meta property="og:description" content="Setki ofert od sprawdzonych dealerów." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://carsalon.pl/brands/carsalon/og-image.png" />
    <meta property="og:url" content="https://carsalon.pl" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CarSalon - auta nowe i używane z gwarancją" />
    <meta name="twitter:description" content="Setki ofert od sprawdzonych dealerów." />
    <meta name="twitter:image" content="https://carsalon.pl/brands/carsalon/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
