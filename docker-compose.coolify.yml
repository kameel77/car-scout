version: '3.8'

# Universal Coolify deployment file for ALL environments.
# Used by: dev.carsalon.pl     (IMAGE_TAG=dev,     BRAND=carsalon,  COMPOSE_PROJECT_NAME=carscout-dev)
#           dev.motolia.pl      (IMAGE_TAG=dev,     BRAND=motolia,   COMPOSE_PROJECT_NAME=motolia-dev)
#           staging.carsalon.pl (IMAGE_TAG=staging, BRAND=carsalon,  COMPOSE_PROJECT_NAME=carscout-staging)
#           carsalon.pl         (IMAGE_TAG=main,    BRAND=carsalon,  COMPOSE_PROJECT_NAME=carscout-prod)
#           motolia.pl          (IMAGE_TAG=main,    BRAND=motolia,   COMPOSE_PROJECT_NAME=motolia-prod)
#
# In Coolify: set "Docker Compose Location" to /docker-compose.coolify.yml
#
# UPLOADS PERSISTENCE:
# Uses a literal bind mount path - Coolify rejects ${...} variables in bind mount paths
# but accepts literal paths. Each environment should have its own bind mount path
# if running on the same host. Override via docker-compose.override.yml per environment.
# Pre-requisite: host directory must exist before first deploy.
# DEV path:     /srv/carscout-uploads
# STAGING path: /srv/carscout-staging-uploads
# PROD path:    /srv/carscout-prod-uploads

services:
  # Backend API — pulled from GHCR, built by GitHub Actions
  carscout-api:
    image: ghcr.io/kameel77/car-scout-backend:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: "${COMPOSE_PROJECT_NAME}-api"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: "3000"
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
      ANALYTICS_DEFAULT_DAYS: ${ANALYTICS_DEFAULT_DAYS:-30}
      ANALYTICS_MAX_DAYS: ${ANALYTICS_MAX_DAYS:-365}
      ANALYTICS_CACHE_TTL: ${ANALYTICS_CACHE_TTL:-300}
      CORS_ORIGINS: ${CORS_ORIGINS}
      INTERNAL_FRONTEND_URL: ${INTERNAL_FRONTEND_URL:-http://${COMPOSE_PROJECT_NAME}-frontend:80}
      BRAND: ${BRAND:-carsalon}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      # Literal bind mount - Coolify rejects ${VAR} in paths but accepts literal paths.
      # Data lives on host filesystem, survives docker compose down -v and stack resets.
      # NOTE: If dev/staging/prod share a server, each needs a different literal path.
      # Use a Coolify-specific docker-compose override per environment in that case.
      - /srv/carscout-uploads:/app/uploads
    networks:
      carscout-private:
        aliases:
          - backend
      coolify:
        aliases:
          - "${COMPOSE_PROJECT_NAME}-backend"

  # Frontend (Nginx) — image is brand-specific, built by GitHub Actions
  frontend:
    image: ghcr.io/kameel77/car-scout-frontend-${BRAND:-carsalon}:${IMAGE_TAG:-dev}
    pull_policy: always
    container_name: "${COMPOSE_PROJECT_NAME}-frontend"
    environment:
      # Use the unique alias defined on the coolify network to prevent DNS collisions
      # across multiple environments. Do NOT use the compose service name "carscout-api"
      # because it is shared across all environments on the coolify network.
      BACKEND_URL: "http://${COMPOSE_PROJECT_NAME}-backend:3000"
    restart: unless-stopped
    expose:
      - "80"
    # NOTE: Do NOT add custom traefik.http.services.* labels here.
    # Coolify doesn't expand env vars in labels, which causes all environments
    # on the same server to share one Traefik service pool → requests get routed
    # to the wrong container. Coolify auto-generates unique router/service names using UUIDs.
    depends_on:
      carscout-api:
        condition: service_healthy
    networks:
      carscout-private:
        aliases:
          - frontend
      coolify:
        aliases:
          - "${COMPOSE_PROJECT_NAME}-frontend"

# No named volumes - using bind mount (see carscout-api volumes above).
# Host path /srv/carscout-uploads must exist before deploy.

networks:
  carscout-private:
    driver: bridge
    name: "${COMPOSE_PROJECT_NAME}-private"
  coolify:
    name: coolify
    external: true
