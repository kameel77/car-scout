# Rate limiting zones (http-level directives)
# Uses CF-Connecting-IP header as key (real client IP behind Cloudflare proxy)
# Falls back to $remote_addr if header is missing

map $http_cf_connecting_ip $rate_limit_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $rate_limit_key zone=general:10m rate=10r/s;
limit_req_zone $rate_limit_key zone=api:10m rate=30r/s;

# Return 429 (Too Many Requests) instead of default 503
limit_req_status 429;
