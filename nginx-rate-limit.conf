# Real IP Configuration
# Trust Docker internal networks (Coolify, Traefik)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Extract the client IP from the end of X-Forwarded-For
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limiting zones (http-level directives)
# Uses CF-Connecting-IP header as key (real client IP behind Cloudflare proxy)
# Falls back to $remote_addr (which is now properly extracted) if header is missing

map $http_cf_connecting_ip $rate_limit_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $rate_limit_key zone=general:10m rate=10r/s;
limit_req_zone $rate_limit_key zone=api:10m rate=30r/s;

# Return 429 (Too Many Requests) instead of default 503
limit_req_status 429;
