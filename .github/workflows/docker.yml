name: Docker Build & Push

on:
  push:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
            brand: none
          - service: frontend-carsalon
            context: .
            file: ./Dockerfile
            brand: carsalon
          - service: frontend-motolia
            context: .
            file: ./Dockerfile
            brand: motolia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
            VITE_BRAND=${{ matrix.brand }}

      - name: Trivy vulnerability scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.ref_name }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

  # Coolify's own push webhook is deliberately disabled: it fired on push, minutes
  # before this workflow finished pushing images, so it redeployed the PREVIOUS build.
  # Triggering from here instead guarantees the images exist before Coolify pulls them.
  # `needs` also means a CRITICAL Trivy finding on main blocks the deployment.
  deploy-staging:
    needs: build-and-push
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment (staging)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://cool.motolia.pl/api/v1/deploy?uuid=qoluqdwea0iq5rmifnwmzvp1" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

  # main stays manual on purpose. This job only makes the pending deploy visible,
  # so a fix cannot sit built-but-unshipped without anyone noticing.
  notify-main:
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Flag images awaiting production deploy
        run: |
          {
            echo "### Obrazy \`main\` gotowe — czekają na ręczne wdrożenie"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Wdróż w Coolify: https://cool.motolia.pl → Motolia → production → Redeploy"
          } >> "$GITHUB_STEP_SUMMARY"

