server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Docker DNS resolver — IPv4 only, re-resolve every 5s
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_addr "${BACKEND_URL}";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # ──────────────────────────────────────────────
    # BOT / SCANNER BLOCKING (early return, no body)
    # ──────────────────────────────────────────────

    # Block vulnerability scanners by User-Agent (444 = drop connection silently)
    if ($http_user_agent ~* (curl/[78]|sqlmap|nikto|dirbuster|nessus|w3af|acunetix|masscan|zgrab|httpx|nuclei)) {
        return 444;
    }

    # Block WordPress / CMS probing paths
    location ~* ^/(xmlrpc\.php|wp-login\.php|wp-admin|wp-content|wp-includes) {
        return 444;
    }

    # Block webhook/form/upload scanning patterns
    location ~* ^/(webhook|form|upload|fileupload|file-upload|uploadfile|import|v1/upload|v2/upload)(/|$) {
        return 444;
    }

    # Block sensitive config file probes
    location ~* (\.(env|git|svn|htaccess|htpasswd|bak|sql|log)$|sftp-config\.json$|\.vscode/) {
        return 444;
    }

    # ──────────────────────────────────────────────
    # NORMAL ROUTES
    # ──────────────────────────────────────────────

    # SPA Routing — only GET/HEAD, rate limited
    location / {
        limit_req zone=general burst=20 nodelay;

        # Only allow GET and HEAD for SPA routes
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ /index.html;
    }

    # Health check proxy
    location /health {
        proxy_pass $backend_addr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API Proxy — higher rate limit, all methods allowed
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass $backend_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploaded assets proxy
    location /uploads/ {
        proxy_pass $backend_addr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # REST settings endpoint (used by monitoring bots)
    location = /rest/settings {
        try_files $uri /index.html;
    }
}
