server {
    listen 80;
    server_name localhost;
    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # ──────────────────────────────────────────────
    # BOT / SCANNER BLOCKING (early return, no body)
    # ──────────────────────────────────────────────

    # Block vulnerability scanners by User-Agent (444 = drop connection silently)
    # Note: Artemis (CERT PL) is NOT blocked — legitimate security scanner
    # Note: HealthCheck/* UA is whitelisted for internal monitoring
    set $block_scanner "0";
    if ($http_user_agent ~* (sqlmap|nikto|dirbuster|nessus|w3af|acunetix|masscan|zgrab|httpx|nuclei)) {
        set $block_scanner "1";
    }
    if ($http_user_agent ~* "HealthCheck/") {
        set $block_scanner "0";
    }
    if ($block_scanner = "1") {
        return 444;
    }

    # curl is blocked only on /api/ and /uploads/ (see those locations).
    # Pages stay open to curl for SEO verification and legitimate fetchers.
    set $block_curl "0";
    if ($http_user_agent ~* "curl/[78]") {
        set $block_curl "1";
    }

    # Block WordPress / CMS probing paths
    location ~* ^/(xmlrpc\.php|wp-login\.php|wp-l0gin\.php|wp-admin|wp-content|wp-includes|wp67|WordPressCore|Auth|BrutalShell|Cache|Content|Cookie|Core-Econ|Diff|aahana)(/|$) {
        return 444;
    }

    # Block ALL PHP files (Node.js/React app does not use PHP)
    # This acts as a silver bullet against 90% of vulnerability scanners
    location ~* \.php(\d+)?$ {
        return 444;
    }

    # Block webhook/form/upload scanning patterns
    location ~* ^/(webhook|form|upload|fileupload|file-upload|uploadfile|import|v1/upload|v2/upload)(/|$) {
        return 444;
    }

    # Block common CMS/backup/directory probing paths
    location ~* ^/(wordpress|backup|wp|old|new|gc\.php|lol\.php|shop\.php|indeex\.php|templates/beez3|admin\.php|autoloadclassmap\.php|fox\.php|bi\.php)(/|$) {
        return 444;
    }

    # Legacy /storage/ paths — no longer served, return 404
    location /storage/ {
        return 404;
    }

    # Block sensitive config file probes
    location ~* (\.(env|htaccess|htpasswd|bak|sql|log)$|sftp-config\.json$|\.vscode/) {
        return 444;
    }

    # VCS directory probes (.git/, .svn/, .hg/) — return 404 fast
    # Artemis and other scanners probe these heavily; SPA fallback would serve index.html
    location ~* ^/\.(git|svn|hg)(/|$) {
        return 404;
    }

    # SQL injection / path traversal patterns in URL — return 404 fast
    # Prevents SPA fallback from processing encoded SQL payloads
    # Matches: ORDER BY, UNION SELECT, AND x=x, CASE WHEN, etc.
    location ~* ((%27|%22|%2527|%2522).*(%4F%52%44%45%52|%53%45%4C%45%43%54|%41%4E%44|%254F%2552|%2553%2545|%2541%254E)|(%27|')\s*(OR|AND|ORDER|UNION|SELECT)\s|(%2F%2F|%5C%5C|\.\./)) {
        return 404;
    }

    # ──────────────────────────────────────────────
    # NORMAL ROUTES
    # ──────────────────────────────────────────────

    # SPA Routing — only GET/HEAD, rate limited
    # Dynamic Configuration
    # We serve this instead of using sed to modify minified JS files (which can crash on long lines)
    location = /config.js {
        default_type application/javascript;
        # VITE_TURNSTILE_SITE_KEY is replaced by envsubst during Nginx startup
        return 200 "window.ENV = { TURNSTILE_SITE_KEY: '${VITE_TURNSTILE_SITE_KEY}' };";
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req zone=scanner burst=5 nodelay;

        # Only allow GET and HEAD for SPA routes
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri @render;
    }

    # Homepage: try_files would match the root directory and serve the static
    # shell — route it to the backend render explicitly
    location = / {
        limit_req zone=general burst=20 nodelay;
        limit_req zone=scanner burst=5 nodelay;

        limit_except GET HEAD {
            deny all;
        }

        try_files /__nonexistent @render;
    }

    # SEO meta-injection: backend renders index.html with per-URL head tags
    location @render {
        # $request_uri stays percent-encoded (prevents request splitting);
        # the backend strips the query part itself
        proxy_pass ${BACKEND_URL}/api/render?path=$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_fallback;
    }

    # Static SPA shell when backend is unavailable
    location @spa_fallback {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Health check proxy
    location /health {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Proxy sitemap.xml to the backend
    location = /sitemap.xml {
        proxy_pass ${BACKEND_URL}/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy robots.txt to the backend (brand-aware Sitemap line)
    location = /robots.txt {
        proxy_pass ${BACKEND_URL}/api/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy — higher rate limit, all methods allowed
    location /api/ {
        if ($block_curl = "1") {
            return 444;
        }
        limit_req zone=api burst=50 nodelay;

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploaded assets proxy
    location /uploads/ {
        if ($block_curl = "1") {
            return 444;
        }
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets caching
    location /assets/ {
        autoindex off;
        
        # Only cache 200 OK responses to prevent Cloudflare from caching 404s for old chunks
        # Use a map or direct header if needed, but the easiest way is to add a proxy-like cache rule
        # Since these are static files, we can just add headers but we need to avoid caching 404s.
        # Actually, Nginx "expires" adds headers regardless of status code.
        # So we use a map or check status code, or simply use `expires` conditionally, but `expires` doesn't support conditional.
        # Let's set a generic Cache-Control, but only when $status = 200? No, Nginx config for this is:
        # map $status $cache_control { 200 "public, max-age=31536000, immutable"; default "no-cache, no-store, must-revalidate"; }
        # Unfortunately we can't define map inside server block.
        # Let's just use try_files to return 404 without headers if file is missing.
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # REST settings endpoint (used by monitoring bots)
    location = /rest/settings {
        try_files $uri /index.html;
    }
}
