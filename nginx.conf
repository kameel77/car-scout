server {
    listen 80;
    server_name localhost;
    client_max_body_size 500M;

    # Dynamically resolve Docker backend to prevent DNS caching issues and IPv6 mismatch
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url "${BACKEND_URL}";


    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # ──────────────────────────────────────────────
    # BOT / SCANNER BLOCKING (early return, no body)
    # ──────────────────────────────────────────────

    # Block vulnerability scanners by User-Agent (444 = drop connection silently)
    # Note: Artemis (CERT PL) is NOT blocked — legitimate security scanner
    # Note: HealthCheck/* UA is whitelisted for internal monitoring
    set $block_scanner "0";
    if ($http_user_agent ~* (sqlmap|nikto|dirbuster|nessus|w3af|acunetix|masscan|zgrab|httpx|nuclei)) {
        set $block_scanner "1";
    }
    if ($http_user_agent ~* "HealthCheck/") {
        set $block_scanner "0";
    }
    if ($block_scanner = "1") {
        return 444;
    }

    # curl is blocked only on /api/ and /uploads/ (see those locations).
    # Pages stay open to curl for SEO verification and legitimate fetchers.
    set $block_curl "0";
    if ($http_user_agent ~* "curl/[78]") {
        set $block_curl "1";
    }

    # Block WordPress / CMS probing paths
    location ~* ^/(xmlrpc\.php|wp-login\.php|wp-l0gin\.php|wp-admin|wp-content|wp-includes|wp67|WordPressCore|Auth|BrutalShell|Cache|Content|Cookie|Core-Econ|Diff|aahana)(/|$) {
        return 444;
    }

    # Block ALL PHP files (Node.js/React app does not use PHP)
    # This acts as a silver bullet against 90% of vulnerability scanners
    location ~* \.php(\d+)?$ {
        return 444;
    }

    # Block webhook/form/upload scanning patterns
    location ~* ^/(webhook|form|upload|fileupload|file-upload|uploadfile|import|v1/upload|v2/upload)(/|$) {
        return 444;
    }

    # Block common CMS/backup/directory probing paths
    location ~* ^/(wordpress|backup|wp|old|new|gc\.php|lol\.php|shop\.php|indeex\.php|templates/beez3|admin\.php|autoloadclassmap\.php|fox\.php|bi\.php)(/|$) {
        return 444;
    }

    # Legacy /storage/ paths — no longer served, return 404
    location /storage/ {
        return 404;
    }

    # Block sensitive config file probes
    location ~* (\.(env|htaccess|htpasswd|bak|sql|log)$|sftp-config\.json$|\.vscode/) {
        return 444;
    }

    # VCS directory probes (.git/, .svn/, .hg/) — return 404 fast
    # Artemis and other scanners probe these heavily; SPA fallback would serve index.html
    location ~* ^/\.(git|svn|hg)(/|$) {
        return 404;
    }

    # SQL injection / path traversal patterns in URL — return 404 fast
    # Prevents SPA fallback from processing encoded SQL payloads
    # Matches: ORDER BY, UNION SELECT, AND x=x, CASE WHEN, etc.
    location ~* ((%27|%22|%2527|%2522).*(%4F%52%44%45%52|%53%45%4C%45%43%54|%41%4E%44|%254F%2552|%2553%2545|%2541%254E)|(%27|')\s*(OR|AND|ORDER|UNION|SELECT)\s|(%2F%2F|%5C%5C|\.\./)) {
        return 404;
    }

    # ──────────────────────────────────────────────
    # NORMAL ROUTES
    # ──────────────────────────────────────────────

    # SPA Routing — only GET/HEAD, rate limited
    # Dynamic Configuration
    # We serve this instead of using sed to modify minified JS files (which can crash on long lines)
    location = /config.js {
        default_type application/javascript;
        # VITE_TURNSTILE_SITE_KEY is replaced by envsubst during Nginx startup
        return 200 "window.ENV = { TURNSTILE_SITE_KEY: '${VITE_TURNSTILE_SITE_KEY}' };";
    }

    location / {
        limit_req zone=general burst=30 nodelay;

        # Only allow GET and HEAD for SPA routes
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri @render;
    }

    # Homepage: try_files would match the root directory and serve the static
    # shell — route it to the backend render explicitly
    location = / {
        limit_req zone=general burst=30 nodelay;

        limit_except GET HEAD {
            deny all;
        }

        try_files /__nonexistent @render;
    }

    # SEO meta-injection: backend renders index.html with per-URL head tags
    location @render {
        # add_header in this block DISCARDS all add_header directives inherited
        # from the server block (nginx rule: inheritance only happens when the
        # current level defines none) — re-add the security headers from the
        # top of this file or they get silently dropped from every rendered page.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Content-Security-Policy — REPORT-ONLY.
        # Why Report-Only: a previous enforcing policy (script-src/connect-src
        # 'self' only) broke GTM/GA4/Google Ads/Clarity in production — see the
        # comment on `contentSecurityPolicy: false` in backend/src/app.ts. This
        # header only logs violations to the browser console for now; it cannot
        # break the site. Violations are also POSTed to report-uri below, which
        # lands in the backend at POST /api/csp-report (backend/src/routes/csp-report.ts)
        # and is logged as a single `fastify.log.warn(..., 'CSP violation')` line —
        # watch that log, not just the browser console.
        #
        # To promote to enforcing later:
        #   1. Watch the /api/csp-report log line (or the browser console on
        #      staging/prod) for real traffic across all routes, incl.
        #      GTM-injected tags (GA4, Google Ads, Clarity).
        #   2. Add any legitimate origins the reports surface (e.g. Google Ads
        #      conversion domains, additional Clarity collectors) to the list
        #      below.
        #   3. Rename this header from Content-Security-Policy-Report-Only to
        #      Content-Security-Policy.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://challenges.cloudflare.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/csp-report;";

        # $request_uri stays percent-encoded (prevents request splitting);
        # the backend strips the query part itself
        proxy_pass $backend_url/api/render?path=$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_fallback;
    }

    # Static SPA shell when backend is unavailable
    location @spa_fallback {
        # This block already had its own add_header (Cache-Control), which per
        # nginx's inheritance rule means it does NOT inherit the server-level
        # X-Frame-Options / X-XSS-Protection / X-Content-Type-Options — those
        # were being silently dropped from this response before. Re-added here.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Content-Security-Policy — REPORT-ONLY. See the @render location above
        # for rationale, the promotion-to-enforcing steps, and where violations
        # land (POST /api/csp-report). Kept identical to @render's policy.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://challenges.cloudflare.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/csp-report;";
        try_files /index.html =404;
    }

    # Health check proxy
    location /health {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Proxy sitemap.xml to the backend
    location = /sitemap.xml {
        proxy_pass $backend_url/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy robots.txt to the backend (brand-aware Sitemap line)
    location = /robots.txt {
        proxy_pass $backend_url/api/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy llms.txt and llms-full.txt to the backend
    location = /llms.txt {
        proxy_pass $backend_url/api/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms-full.txt {
        proxy_pass $backend_url/api/llms-full.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 9116 security contact file (public/.well-known/security.txt, copied
    # into the build by Vite). Without this exact-match location, the request
    # would fall through to `location /` → try_files → @render and come back
    # as the rendered index.html instead of the plain-text file. No add_header
    # here on purpose, so it keeps inheriting the server-level X-Frame-Options /
    # X-XSS-Protection / X-Content-Type-Options headers (see nginx add_header
    # inheritance rule noted at @render above).
    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # Proxy marketing feeds (facebook-feed.csv, facebook-feed.xml, google-feed.xml, feed.xml) to the backend
    location ~ ^/(facebook-feed|google-feed|feed)\.(xml|csv)$ {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy — higher rate limit, all methods allowed
    location /api/ {
        if ($block_curl = "1") {
            return 444;
        }
        limit_req zone=api burst=50 nodelay;

        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploaded assets proxy
    location /uploads/ {
        if ($block_curl = "1") {
            return 444;
        }
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rate_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Brand statics (logo, favicon, og-image) — rzadko się zmieniają
    location /brands/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # Self-hosted fonts (Archivo + subsety CE) — bez tego bloku /fonts/*.woff2
    # wpada w `location /`, jest serwowane bez nagłówka Cache-Control i przeglądarka
    # rewaliduje je przy każdej wizycie (Lighthouse: "Use efficient cache lifetimes").
    # Cache-busting przez zmianę nazwy pliku, tak jak dla /brands/ — stąd max-age
    # bez `immutable` (nazwy nie zawierają hasha treści).
    location /fonts/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, no-transform";
    }

    # Static assets caching
    location /assets/ {
        autoindex off;
        
        # Only cache 200 OK responses to prevent Cloudflare from caching 404s for old chunks
        # Use a map or direct header if needed, but the easiest way is to add a proxy-like cache rule
        # Since these are static files, we can just add headers but we need to avoid caching 404s.
        # Actually, Nginx "expires" adds headers regardless of status code.
        # So we use a map or check status code, or simply use `expires` conditionally, but `expires` doesn't support conditional.
        # Let's set a generic Cache-Control, but only when $status = 200? No, Nginx config for this is:
        # map $status $cache_control { 200 "public, max-age=31536000, immutable"; default "no-cache, no-store, must-revalidate"; }
        # Unfortunately we can't define map inside server block.
        # Let's just use try_files to return 404 without headers if file is missing.
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # REST settings endpoint (used by monitoring bots)
    location = /rest/settings {
        try_files $uri /index.html;
    }
}
